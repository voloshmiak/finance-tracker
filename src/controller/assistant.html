<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Фінансовий асистент</title>
    <style>
        :root { --bg:#0f1115; --panel:#181b22; --me:#2d6cdf; --bot:#22262f; --text:#e6e8eb; --muted:#8b909a; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
        header { padding:16px 20px; border-bottom:1px solid #262a33; font-weight:600; font-size:17px; }
        header span { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
        #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }

        form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid #262a33; max-width:820px; width:100%; margin:0 auto; }
        input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2a2f3a; background:var(--panel); color:var(--text); font-size:15px; outline:none; }
        input:focus { border-color:var(--me); }
        button { padding:12px 20px; border:none; border-radius:10px; background:var(--me); color:#fff; font-size:15px; cursor:pointer; }
        button:disabled { opacity:.5; cursor:default; }
        header { display:flex; align-items:center; gap:12px; }
        header .title { flex:1; }
        select { padding:7px 10px; border-radius:8px; border:1px solid #2a2f3a; background:var(--panel); color:var(--text); font-size:13px; outline:none; cursor:pointer; }
        select:focus { border-color:var(--me); }
        #chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 4px; max-width:820px; width:100%; margin:0 auto; }

    </style>
</head>
<body>
<header>
    <span class="title">💰 Financial Assistant</span>
    <select id="model" title="Модель Gemini">
        <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
    </select>
</header>
<div id="chat"></div>
<div id="chips"></div>
<form id="form">
    <input id="q" placeholder="Скільки я витратив на їжу минулого місяця?" autocomplete="off" autofocus />
    <button id="send" type="submit">Надіслати</button>
</form>
<script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('q');
    const send = document.getElementById('send');
    const modelSel = document.getElementById('model');

    function bubble(text, cls) {
        const d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }

    function setBusy(busy) {
        send.disabled = busy;
        document.querySelectorAll('.chip').forEach((c) => { c.disabled = busy; });
    }

    async function sendQuestion(q) {
        q = q.trim();
        if (!q) return;
        bubble(q, 'me');
        input.value = '';
        setBusy(true);
        const thinking = bubble('думаю…', 'bot typing');
        try {
            const res = await fetch('/api/assistant/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q, model: modelSel.value }),
            });
            const data = await res.json();
            thinking.remove();
            bubble(res.ok ? data.answer : ('Помилка: ' + (data.error || res.status)), 'bot');
        } catch (err) {
            thinking.remove();
            bubble('Помилка зʼєднання: ' + err.message, 'bot');
        } finally {
            setBusy(false);
            input.focus();
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendQuestion(input.value);
    });

    const presets = [
        { label: '💡 Поради для економії', prompt: 'Проаналізуй мої витрати й дай конкретні поради, як зекономити. Покажи, на чому я переплачую.' },
        { label: '🔍 Критика моїх витрат', prompt: 'Критично оціни мої фінансові звички за останні місяці. Де я поводжуся нераціонально? Будь відвертим.' },
        { label: '📊 Огляд за місяць', prompt: 'Зроби підсумок моїх витрат за минулий місяць: загальна сума, топ категорій, порівняння з попереднім місяцем.' },
        { label: '🍔 Витрати на їжу', prompt: 'Скільки я витрачаю на їжу та кафе щомісяця? Це багато? Як можна зменшити?' },
        { label: '📈 Динаміка витрат', prompt: 'Покажи, як змінювалися мої загальні витрати по місяцях. Чи є тривожна тенденція?' },
        { label: '💳 Розподіл по картках', prompt: 'З яких карток я витрачаю найбільше і на що саме? Чи раціонально я ними користуюся?' },
        { label: '🔁 Підписки і регулярні платежі', prompt: 'Знайди регулярні або повторювані платежі (підписки, сервіси). Чи всі вони мені потрібні?' },
        { label: '🎯 Скласти бюджет', prompt: 'На основі моїх реальних витрат запропонуй розумний місячний бюджет по категоріях.' },
    ];

    const chipsBox = document.getElementById('chips');
    for (const p of presets) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.type = 'button';
        b.textContent = p.label;
        b.addEventListener('click', () => sendQuestion(p.prompt));
        chipsBox.appendChild(b);
    }
</script>
</body>
</html>
