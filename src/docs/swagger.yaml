basePath: /api
definitions:
  controller.CreateExpenseRequest:
    properties:
      amount:
        type: integer
      category:
        type: string
      description:
        type: string
    type: object
  entity.Expense:
    properties:
      amount:
        type: integer
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for the Finance Tracker application
  title: Finance Tracker API
  version: 0.0.1
paths:
  /docs:
    get:
      description: Serves the interactive API reference UI
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: API Documentation
      tags:
      - System
  /expenses:
    post:
      consumes:
      - application/json
      description: Adds a new expense entry to the finance tracker
      parameters:
      - description: Expense payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.CreateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Expense'
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: Failed to create expense
          schema:
            type: string
      summary: Create Expense
      tags:
      - Expense
  /health:
    get:
      description: Returns 200 OK when the service is healthy
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - System
swagger: "2.0"
