basePath: /api
info:
  contact: {}
  description: This is the API documentation for the Finance Tracker application
  title: Finance Tracker API
  version: 0.0.1
paths:
  /cron/reminder:
    post:
      description: Triggers a Telegram reminder about card reports not yet uploaded
        this month. Intended to be called by a scheduled job.
      parameters:
      - description: Bearer <auth token>
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: Reminder sent
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Send Reminder
      tags:
      - Cron
  /docs:
    get:
      description: Serves the interactive API reference UI
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: API Documentation
      tags:
      - System
  /health:
    get:
      description: Returns 200 OK when the service is healthy
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - System
swagger: "2.0"
