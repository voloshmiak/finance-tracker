basePath: /api
definitions:
  assistant.Model:
    properties:
      id:
        description: e.g. "gemini-2.5-flash"
        type: string
      label:
        description: human-friendly display name
        type: string
    type: object
  controller.askRequest:
    properties:
      model:
        description: optional; empty uses the default model
        type: string
      question:
        type: string
    type: object
  controller.askResponse:
    properties:
      answer:
        type: string
    type: object
  controller.modelsResponse:
    properties:
      default:
        type: string
      models:
        items:
          $ref: '#/definitions/assistant.Model'
        type: array
    type: object
  telegram.Chat:
    properties:
      id:
        type: integer
    type: object
  telegram.Document:
    properties:
      file_id:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
    type: object
  telegram.Message:
    properties:
      caption:
        description: text sent alongside a file (e.g. card last 4 digits)
        type: string
      chat:
        $ref: '#/definitions/telegram.Chat'
      document:
        $ref: '#/definitions/telegram.Document'
      message_id:
        type: integer
    type: object
  telegram.Update:
    properties:
      message:
        $ref: '#/definitions/telegram.Message'
      update_id:
        type: integer
    type: object
info:
  contact: {}
  description: This is theAPI documentation for the Finance Tracker application
  title: Finance Tracker API
  version: 0.1.0
paths:
  /assistant:
    get:
      description: Serves the HTML chat interface for the AI finance assistant. Protected
        by HTTP Basic Auth.
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Assistant chat UI
      tags:
      - Assistant
  /assistant/ask:
    post:
      consumes:
      - application/json
      description: Sends a natural-language question about your finances and returns
        the assistant's answer. Protected by HTTP Basic Auth.
      parameters:
      - description: Question payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.askRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.askResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Ask the assistant
      tags:
      - Assistant
  /assistant/models:
    get:
      description: Returns the Gemini models that support generation, plus the default.
        Protected by HTTP Basic Auth.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.modelsResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List available models
      tags:
      - Assistant
  /cron/reminder:
    post:
      description: Triggers a Telegram reminder about card reports not yet uploaded
        this month. Intended to be called by a scheduled job.
      parameters:
      - description: Bearer <auth token>
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: Reminder sent
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Send Reminder
      tags:
      - Cron
  /docs:
    get:
      description: Serves the interactive API reference UI
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: API Documentation
      tags:
      - System
  /health:
    get:
      description: Returns 200 OK when the service is healthy
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - System
  /webhook:
    post:
      consumes:
      - application/json
      description: Receives Telegram bot updates. When a message carries a bank statement
        document (monobank CSV, Credit Agricole XLSX, or a-bank PDF), the file is
        downloaded, parsed, deduplicated and stored. Authenticated via the Telegram
        secret token header.
      parameters:
      - description: Telegram webhook secret token
        in: header
        name: X-Telegram-Bot-Api-Secret-Token
        required: true
        type: string
      - description: Telegram update payload
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/telegram.Update'
      responses:
        "200":
          description: Update processed
        "401":
          description: Invalid secret token
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Telegram webhook
      tags:
      - Telegram
swagger: "2.0"
