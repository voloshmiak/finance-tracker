name: Deploy to Cloud Run on Tag

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_ID: melodic-furnace-494620-r4
  REGION: europe-central2
  SERVICE_NAME: finance-tracker
  REPO_NAME: finance-tracker
  TELEGRAM_HOST: https://api.telegram.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          IMAGE_URL=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${TAG_NAME}
          docker build -t $IMAGE_URL .
          docker push $IMAGE_URL
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URL }}
          flags: '--service-account=finance-tracker-run@melodic-furnace-494620-r4.iam.gserviceaccount.com'
          env_vars: |
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_SSLMODE=${{ secrets.DB_SSLMODE }}
            SERVER_AUTH_TOKEN=${{ secrets.SERVER_AUTH_TOKEN }}
            TELEGRAM_HOST=${{ env.TELEGRAM_HOST }}
            TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            DB_READONLY_USER=${{ secrets.DB_READONLY_USER }}
            DB_READONLY_PASSWORD=${{ secrets.DB_READONLY_PASSWORD}}
            ASSISTANT_USERNAME=${{ secrets.ASSISTANT_USERNAME}}
            ASSISTANT_PASSWORD=${{ secrets.ASSISTANT_PASSWORD}}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY}}
