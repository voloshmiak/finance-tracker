name: Reminder Workflow
on:
  schedule:
    - cron: '0 13 1,2,3,5,10,15,25 * *'

  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-slim
    steps:
      - run: curl -X POST -H 'Authorization' 'Bearer ${{secrets.SERVER_AUTH_TOKEN}}'
          ${{secrets.SERVER_HOST}}/api/cron/reminder
