name: lint

on:
  push:
    branches: [main]   # PRs are covered by lint-report.yaml

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool golangci-lint run ./...